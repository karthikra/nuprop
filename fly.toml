# fly.toml app configuration file generated for nuprop on 2026-05-15T14:16:21+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nuprop'
primary_region = 'bom'

[build]

[deploy]
  # The Dockerfile's WORKDIR is /app/backend, so no `cd` is needed.
  # Fly's release_command is exec-form (not shell), so a literal
  # 'cd ... && alembic ...' would fail to spawn.
  release_command = 'alembic upgrade head'

[env]
  DEBUG = 'false'
  ENVIRONMENT = 'production'
  PORT = '8080'

[processes]
  app = 'uvicorn app.main:app --host 0.0.0.0 --port 8080'
  worker = 'arq app.workers.pipeline.WorkerSettings'

[[mounts]]
  source = 'nuprop_data'
  destination = '/data'
  initial_size = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
