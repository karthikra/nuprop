name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:  # Also allow manual re-deploy from the Actions UI

# Serialize deploys per branch so back-to-back pushes (e.g. `feat: merge` +
# `docs: tidy`) don't race on `alembic upgrade head` in the release_command.
# cancel-in-progress: false queues the next deploy instead of killing the
# in-flight one — safer when a migration is mid-DDL.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure worker process group is running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine list -a nuprop --json \
            | jq -r '.[] | select(.config.metadata.fly_process_group == "worker" and .state == "stopped") | .id' \
            | xargs -r -I{} flyctl machine start {} -a nuprop
