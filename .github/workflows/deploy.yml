name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:  # Also allow manual re-deploy from the Actions UI

# Serialize deploys per branch so back-to-back pushes (e.g. `feat: merge` +
# `docs: tidy`) don't race on `alembic upgrade head` in the release_command.
# cancel-in-progress: false queues the next deploy instead of killing the
# in-flight one — safer when a migration is mid-DDL.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Safety net for the `fly secrets set` path, which stops the worker group
      # without restarting it. A normal `flyctl deploy` already starts the
      # primary worker, so this is usually a no-op. Only act when NO worker is
      # running — this leaves an intentionally-stopped standby alone, and a
      # transient single-machine start error never fails the deploy.
      - name: Ensure a worker is running
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set +e
          machines=$(flyctl machine list -a nuprop --json)
          running=$(echo "$machines" | jq '[.[] | select(.config.metadata.fly_process_group == "worker" and .state == "started")] | length')
          running=${running:-0}
          echo "Worker machines running: $running"
          if [ "$running" -eq 0 ]; then
            target=$(echo "$machines" | jq -r 'first(.[] | select(.config.metadata.fly_process_group == "worker" and .state == "stopped") | .id) // empty')
            if [ -n "$target" ]; then
              echo "No worker running — starting $target"
              flyctl machine start "$target" -a nuprop || echo "WARN: could not start $target; next deploy will retry"
            else
              echo "WARN: no stopped worker available to start"
            fi
          else
            echo "Worker already running — standby machines left stopped (intentional)."
          fi
          exit 0
