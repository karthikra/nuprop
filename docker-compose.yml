services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nuprop
      POSTGRES_USER: nuprop
      POSTGRES_PASSWORD: nuprop_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuprop"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # .env.docker supplies VOYAGE_API_KEY, RESEND_API_KEY, GOOGLE_/SLACK_CLIENT_*, etc.
    # Claude inference goes through AWS Bedrock — see AWS_* below; never set ANTHROPIC_API_KEY.
    env_file: .env.docker
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://nuprop:nuprop_dev_password@db:5432/nuprop
      JWT_SECRET_KEY: local-dev-jwt-secret-change-in-real-prod
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: '["http://localhost:8080"]'
      PROPOSAL_SITE_DOMAIN: localhost:8080
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      # AWS Bedrock auth — forwarded from host shell via the SDK credential chain
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      # AWS_PROFILE / AWS_*_KEY are intentionally NOT forwarded with `${VAR:-}`:
      # an empty-string default sets the env var to "" which boto3 then treats
      # as an explicit (broken) profile name. Mounting ~/.aws read-only is
      # enough — boto3 uses the [default] profile when no env var is set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: http://localhost:8080/settings/gmail-callback
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_REDIRECT_URI: http://localhost:8080/settings/slack-callback
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - appdata:/data
      - ${HOME}/.aws:/root/.aws:ro  # mount host AWS profile config (read-only)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Run Alembic migrations before starting the app
    command: >
      sh -c "
        cd /app/backend &&
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8080
      "

  worker:
    env_file: .env.docker
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://nuprop:nuprop_dev_password@db:5432/nuprop
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      # AWS Bedrock auth — same plumbing as the app process
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      # AWS_PROFILE / AWS_*_KEY are intentionally NOT forwarded with `${VAR:-}`:
      # an empty-string default sets the env var to "" which boto3 then treats
      # as an explicit (broken) profile name. Mounting ~/.aws read-only is
      # enough — boto3 uses the [default] profile when no env var is set.
    volumes:
      - appdata:/data
      - ${HOME}/.aws:/root/.aws:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app/backend
    command: arq app.workers.pipeline.WorkerSettings

volumes:
  pgdata:
  appdata:
